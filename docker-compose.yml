version: '3.8'

services:

  docrouter:
    build: .
    volumes:
      - ./:/runtime
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: '1'
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tika:
    image: dh-mirror.gitverse.ru/apache/tika:latest-full
    restart: unless-stopped
    volumes:
      - ./tika/tika-config.xml:/tika-config.xml:ro
    environment:
      TIKA_CONFIG: /tika-config.xml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9998/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
